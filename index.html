<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Clube da Trufa (Coren)</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Clube da Trufa 🍫</h1>
        <p class="subtitle">Compre 10 trufas no mês e ganhe 1 grátis!</p>

        <div class="tabs">
            <button class="tab-btn active" onclick="mudarAba('mes')">🏆 Ranking do Mês</button>
            <button class="tab-btn" onclick="mudarAba('geral')">⭐ Histórico Geral</button>
        </div>

        <div id="status" class="loading">A atualizar pontuações...</div>

        <!-- Listas onde o JavaScript injetará os cards -->
        <div id="lista-mes" class="ranking-list active"></div>
        <div id="lista-geral" class="ranking-list"></div>

        <!-- Seção do Mini Fliperama -->
        <div class="fliperama-section" id="fliperama-section">
            <div class="fliperama-icon">🕹️</div>
            <h2 class="fliperama-title">Hora de se divertir!</h2>
            <p class="fliperama-msg">Enquanto saboreia a sua trufa, que tal um joguinho? Jogue o nosso mini fliperama e divirta-se! 🍫🎮</p>
            <a href="https://barroca07.github.io/React_Fliperama/" target="_blank" rel="noopener noreferrer" class="fliperama-btn" id="btn-fliperama">
                <span class="fliperama-btn-icon">🎮</span> Jogar Agora
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
